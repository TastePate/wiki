{% extends "encyclopedia/layout.html" %}

{% block title %}
    Encyclopedia
{% endblock %}

{% block body %}
    <h1>Search results:</h1>

    <ul>
        {% for entry in entries %}
            <li><a href="{% url 'encyclopedia:wiki' entry %}">{{ entry }}</a></li>
        {% empty %}
            <li>Search result for "{{ search_input }}" is empty!</li>
        {% endfor %}
    </ul>

{% endblock %}
